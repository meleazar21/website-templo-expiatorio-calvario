# Netlify deployment.
#
# Netlify hosts ONLY the admin panel: https://admin-templo-expiatorio-calvario.netlify.app/admin/
# The public site is on Vercel (https://www.templo-expiatorio-calvario.com); every save
# in the panel is a commit to `master`, and Vercel republishes from it. The panel uses
# `git-gateway`, the sign-in Netlify ships built in: the parish edits online without a
# GitHub account.
#
# To set it up (once):
#   1. Netlify → Add new site → Import from Git → this repository (branch `master`),
#      named `admin-templo-expiatorio-calvario` (the address above).
#   2. Site configuration → Identity → Enable Identity.
#   3. Identity → Registration → Invite only  (so not just anyone can sign up).
#   4. Identity → Services → Git Gateway → Enable.
#   5. Identity → Invite users → the email of whoever will maintain the site. The email
#      links to the site's root; src/main.tsx passes the token on to the panel, where
#      they choose a password.

[build]
  command = "npm run build"
  publish = "dist"

# The public site is published on Vercel, at the official domain; Netlify only hosts the
# panel (/admin/), its sign-in and Git Gateway. So any visit to the public pages here is
# sent to the official domain, and there aren't two copies of the site.
#
# "/" needs `force` because index.html exists. The rest goes without it, so files that
# really exist (/admin/index.html, /admin/config.yml, the photos the panel previews,
# /assets) are still served as-is. /.netlify/* (Identity, Git Gateway) never reaches here.
# The #invite_token of the invitation emails survives the redirect: src/main.tsx then
# sends it on to the panel.
[[redirects]]
  from = "/"
  to = "https://www.templo-expiatorio-calvario.com/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://www.templo-expiatorio-calvario.com/:splat"
  status = 301

# Security headers. Same values as in vercel.json: keep both in sync.
#
# The Content-Security-Policy only lets the browser load what the site really uses:
# its own files, Google Fonts, and the Google Maps
# embed (contact). If a new external service is added someday (another video host,
# analytics...), its domain must be added here or the browser will block it.
# 'unsafe-inline' in style-src is needed for the inline styles in index.html and the
# animation delays; scripts stay strict.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# The CSP goes on the public page only ("/", served from index.html), not on /admin:
# the panel loads Decap from unpkg and the Netlify Identity widget from
# identity.netlify.com, which this strict policy would block. The panel is behind a
# sign-in and marked noindex. The other headers above still cover every path.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
