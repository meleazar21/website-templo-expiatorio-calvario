<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b102b">
<title>Instalar Radio La Voz del Calvario</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff0e8;background:#1b0b17}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 4%,#5e2540 0%,transparent 40%),linear-gradient(145deg,#2d0c20,#170914)}
.card{width:min(100%,470px);border:1px solid #7b4758;background:linear-gradient(140deg,#4b1d32,#291120);border-radius:24px;padding:30px 26px;box-shadow:0 22px 55px rgba(0,0,0,.32)}
.brand{display:flex;align-items:center;gap:15px}.brand img{width:78px;height:78px;border-radius:20px;border:2px solid #ddbe76;background:#330b23}.eyebrow{font-size:10px;letter-spacing:.15em;color:#e0bc89;font-weight:800}.brand strong{display:block;font-size:20px;line-height:1.24;margin-top:6px}
h1{font-size:28px;margin:28px 0 10px;line-height:1.18}p{font-size:14px;line-height:1.7;color:#e1c7ce}
button,.link{width:100%;display:flex;align-items:center;justify-content:center;min-height:50px;font-weight:800;font-size:15px;border-radius:14px;text-decoration:none;cursor:pointer}
button{margin-top:22px;border:0;color:#3e172a;background:linear-gradient(120deg,#ffe5a7,#d9a53d)}.link{margin-top:11px;border:1px solid #956c7d;color:#f6e5e3;background:#ffffff0a}
.hint{border-left:3px solid #edc476;padding:2px 15px;margin-top:24px}.hint p{margin:10px 0}.hint strong{color:#fff3e7}#message{margin:14px 0 0;min-height:22px;color:#f2d791;font-size:13px}button:focus-visible,.link:focus-visible{outline:3px solid #ffe5a7;outline-offset:3px}
</style>
<script>
/* La instalación desde un iframe no es confiable. Esta página se abre en pestaña propia.
   En navegadores Chromium, antesinstallprompt solo puede activarse tras un gesto real. */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {e.preventDefault();installPrompt=e;});
window.addEventListener('appinstalled', () => {const msg=document.getElementById('message');if(msg)msg.textContent='¡Aplicación instalada! Puedes abrirla desde tu pantalla de inicio.';});
window.addEventListener('DOMContentLoaded', () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  const msg=document.getElementById('message');
  const hint=document.getElementById('hint');
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua)&& navigator.maxTouchPoints>1);
  const standalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  if (standalone) {msg.textContent='Ya estás usando la radio como aplicación instalada.';}
  hint.innerHTML=ios
    ? '<strong>En iPhone o iPad (Safari)</strong><p>Abre esta página en Safari, toca <b>Compartir</b>, selecciona <b>Añadir a pantalla de inicio</b>, activa <b>Abrir como app</b> si está disponible y pulsa <b>Añadir</b>.</p>'
    : '<strong>En Android (Chrome)</strong><p>Presiona el botón dorado. Si no aparece un aviso, abre el menú de Chrome (⋮) y elige <b>Instalar aplicación</b> o <b>Añadir a pantalla principal</b>.</p>';
  document.getElementById('installNow').addEventListener('click', async () => {
    if (installPrompt) {
      const pending=installPrompt;installPrompt=null;
      try {const result=await pending.prompt();msg.textContent=result.outcome==='accepted'?'Solicitud de instalación aceptada.':'Instalación cancelada. Puedes intentarlo desde el menú del navegador.';}
      catch(e) {msg.textContent='Utiliza la opción de instalación del navegador.';}
    } else if (ios) {
      msg.textContent='Para instalar en iPhone, utiliza Compartir → Añadir a pantalla de inicio en Safari.';
    } else {
      msg.textContent='Abre el menú ⋮ de tu navegador y selecciona Instalar aplicación o Añadir a pantalla principal.';
    }
  });
});
</script>
</head>
<body>
<main class="card">
  <div class="brand"><img src="./icons/icon-192.png" alt="Icono de Radio La Voz del Calvario"><div><span class="eyebrow">SIEMPRE CONTIGO</span><strong>Radio La Voz del Calvario</strong></div></div>
  <h1>Instala nuestra radio</h1>
  <p>Escucha la transmisión en vivo desde el acceso directo en tu celular, con el icono oficial de la aplicación.</p>
  <button id="installNow" type="button">Instalar aplicación</button>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="hint" id="hint"><strong>Desde tu navegador</strong><p>Utiliza la opción Instalar aplicación o Añadir a pantalla de inicio.</p></div>
  <a class="link" href="./">Abrir la radio completa</a>
</main>
</body>
</html>
